name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: pip install -r backend/smart_home_server/requirements.txt -r backend/forecast_api/requirements-ci.txt
      - run: npm run typecheck
      - run: npm run check:js
      - run: npm run check:python
      - run: npm test
      - run: git diff --check
      - name: Dependency audit report
        continue-on-error: true
        run: npm audit --omit=dev
